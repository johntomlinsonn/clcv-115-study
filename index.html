<head>
<meta charset="utf-8">

<title>CLCV 115 Study</title>
<meta name="description" content="Retrieval-practice study site for CLCV 115 Exams 1 and 2: flashcards, picture quiz, map test, mock exam.">
<script>
/* Which exam? ?exam=1|2 in the URL wins, then the last choice; with neither, Exam 1 data loads behind the exam picker. */
(function () {
  var m = /[?&]exam=([12])\b/.exec(location.search), e = m ? m[1] : null, KEY = "clcv115_exam";
  if (!e) { try { e = localStorage.getItem(KEY); } catch (x) { /* storage unavailable */ } }
  if (e !== "1" && e !== "2") { window.EXAM_PICK = true; e = "1"; }
  else { try { localStorage.setItem(KEY, e); } catch (x) { /* storage unavailable */ } }
  window.EXAM = "e" + e;
  var files = e === "2"
    ? ["data/maps.js", "data/exam2/terms.js", "data/exam2/crq.js", "data/exam2/stories.js", "data/exam2/images.js", "data/exam2/places.js",
       "data/exam2/questions.js", "data/exam2/questions-crq.js", "data/exam2/lectures.js", "data/exam2/config.js"]
    : ["data/terms.js", "data/stories.js", "data/images.js", "data/places.js", "data/maps.js", "data/questions.js", "data/lectures.js", "data/notes.js"];
  for (var i = 0; i < files.length; i++) document.write('<script src="' + files[i] + '"><\/script>');
})();
</script>
